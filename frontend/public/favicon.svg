<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#grad1)" />
  
  <!-- Outer Focus Ring -->
  <circle cx="256" cy="256" r="160" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="24" stroke-dasharray="50 25" />
  
  <!-- Inner Lightning / Focus Bolt -->
  <path d="M280 96L160 272H256L232 416L352 240H256L280 96Z" fill="#FFFFFF" filter="url(#glow)" />
</svg>
